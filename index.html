<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneXpress Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f6f7f9;padding-bottom:80px}
.top{background:#000;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.prod{background:#fff;border-radius:14px;padding:8px}
.prod.im{width:100%;height:160px;background:#fff;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.prod.im img{width:100%;height:100%;object-fit:contain}
.price{color:#25D366;font-weight:900}.add{width:100%;background:#111;color:#fff;border:0;padding:9px;border-radius:8px;margin-top:6px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:16px}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0}.btn{width:100%;padding:12px;border-radius:10px;border:0;font-weight:900;margin-top:8px}.btnP{background:#111;color:#fff}.btnG{background:#25D366;color:#fff}
</style></head><body>
<div class="top"><b>One<span style="color:#25D366">Xpress</span> Shop</b><span>🛒 <b id="cartN">0</b></span></div>
<div style="margin:12px;background:#000;color:#fff;border-radius:12px;padding:12px;font-size:12px">✅ LOJA CONSERTADA - Fotos não ampliam mais!<br>Timberland 10.000 KZ | Sabrinas 3.000 KZ</div>
<div class="grid" id="grid"></div>
<div class="bottom"><div onclick="window.scrollTo(0,0)">🏠 Inicio</div><div onclick="toggleCart()">🛒 Carrinho</div><div onclick="document.getElementById('mAdm').classList.add('show')">⚙️ ADM</div></div>
<div id="cart" style="position:fixed;bottom:70px;left:10px;right:10px;background:#fff;border-radius:16px;padding:16px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)"><div id="cartList"></div><button class="btn btnG" onclick="finalizar()">📲 WhatsApp 925356739</button><button class="btn" style="background:#eee" onclick="toggleCart()">Fechar</button></div>
<div id="mAdm" class="modal"><div class="sheet"><h3>Adicionar Produto</h3><p style="font-size:11px;color:#666">Foto não vai ampliar mais! object-fit:contain</p><input class="inp" id="pNome" placeholder="Nome"><input class="inp" id="pPreco" type="number" placeholder="Preço"><div style="border:2px dashed #25D366;padding:16px;text-align:center;border-radius:10px" onclick="document.getElementById('f').click()">📸 Foto<input type="file" id="f" accept="image/*" hidden><img id="prev" style="width:100%;height:120px;object-fit:contain;display:none;margin-top:8px"></div><button class="btn btnP" onclick="add()">💾 PUBLICAR</button><button class="btn" style="background:#eee" onclick="document.getElementById('mAdm').classList.remove('show')">Fechar</button><div id="lista" style="margin-top:10px"></div></div></div>
<script>
var prods=[
{n:"Sabrina KSM7403",p:3000,d:"36-42 • 4 cores",img:"https://via.placeholder.com/400x400/fff/000?text=KSM7403"},
{n:"Sabrina KSM7463",p:3000,d:"36-42 • Laço",img:"https://via.placeholder.com/400x400/fff/000?text=KSM7463"},
{n:"Sabrina KSM7472",p:3000,d:"36-42 • Luxo",img:"https://via.placeholder.com/400x400/fff/000?text=KSM7472"},
{n:"Sabrina KSM7548",p:3000,d:"36-42 • Lisa",img:"https://via.placeholder.com/400x400/fff/000?text=KSM7548"},
{n:"Infantil KGM7124",p:3000,d:"25-30",img:"https://via.placeholder.com/400x400/fff/000?text=KGM7124"},
{n:"Infantil KGM7128",p:3000,d:"25-30",img:"https://via.placeholder.com/400x400/fff/000?text=KGM7128"},
{n:"Timberland KA16700C",p:10000,d:"39-44 • Azul/Preto",img:"https://via.placeholder.com/400x400/fff/000?text=KA16700C"},
{n:"Timberland Premium",p:10000,d:"39-44 • Azul",img:"https://via.placeholder.com/400x400/fff/000?text=TIMBERLAND"},
{n:"Timberland KA16807A",p:10000,d:"39-44 • Preto",img:"https://via.placeholder.com/400x400/fff/000?text=KA16807A"}
];
var cart=[],tmp='';
document.getElementById('f').addEventListener('change',e=>{var r=new FileReader();r.onload=ev=>{tmp=ev.target.result;document.getElementById('prev').src=tmp;document.getElementById('prev').style.display='block'};r.readAsDataURL(e.target.files[0])});
function render(){var g=document.getElementById('grid');var h='';for(var i=0;i<prods.length;i++){var p=prods[i];h+='<div class=prod><div class=im><img src="'+p.img+'"></div><b style="font-size:12px">'+p.n+'</b><br><small style="font-size:10px">'+p.d+'</small><div class=price>'+p.p+' Kz</div><button class=add onclick="cart.push(prods['+i+']);document.getElementById(\'cartN\').innerText=cart.length;alert(\'Adicionado\')">+ CARRINHO</button><button onclick="prods.splice('+i+',1);render()" style="width:100%;background:#ffe1e1;color:red;border:0;padding:4px;border-radius:6px;margin-top:4px;font-size:10px">Apagar</button></div>'}g.innerHTML=h;var l=document.getElementById('lista');var lh='';for(var i=0;i<prods.length;i++)lh+='<div style="font-size:11px;padding:6px;background:#f5f5f7;margin:3px 0">'+prods[i].n+' <span onclick="prods.splice('+i+',1);render()" style="color:red;float:right">X</span></div>';l.innerHTML=lh;document.getElementById('cartN').innerText=cart.length}
function toggleCart(){var c=document.getElementById('cart');c.style.display=c.style.display=='none'||c.style.display==''?'block':'none';var h='',tot=0;for(var i=0;i<cart.length;i++){tot+=cart[i].p;h+='<div style="font-size:12px;padding:6px;background:#f9f9f9;margin:4px 0">'+cart[i].n+' - '+cart[i].p+' Kz</div>'}document.getElementById('cartList').innerHTML=h+'<b>Total: '+(tot+1500)+' Kz</b>'}
function finalizar(){if(!cart.length){alert('Vazio');return}var tot=0,txt='PEDIDO OneXpress%0A';for(var i=0;i<cart.length;i++){tot+=cart[i].p;txt+=cart[i].n+'%0A'}window.open('https://wa.me/244925356739?text='+txt+'%0ATotal '+(tot+1500)+'Kz','_blank')}
function add(){var n=document.getElementById('pNome').value,p=parseInt(document.getElementById('pPreco').value);if(!n||!p||!tmp){alert('Nome, preço e foto!');return}prods.unshift({n:n,p:p,d:"Novo",img:tmp});tmp='';document.getElementById('pNome').value='';document.getElementById('pPreco').value='';document.getElementById('prev').style.display='none';render();document.getElementById('mAdm').classList.remove('show');alert('Publicado!')}
render();
</script></body></html>
