<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneXpress</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f7;padding-bottom:80px}.top{background:#111;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.badge{background:red;color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.prod{background:#fff;border-radius:12px;padding:8px;text-align:center}.prod img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#eee}.price{color:#25D366;font-weight:900;margin:5px 0}.add{width:100%;background:#111;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:800}.cart{position:fixed;bottom:70px;left:8px;right:8px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:12px;display:none;max-height:70vh;overflow:auto;z-index:20}.cart.show{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:30}.bottom div{text-align:center;font-size:10px;flex:1}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:#fff;border-radius:14px;width:100%;max-width:380px;padding:14px;max-height:92vh;overflow:auto}.sheet input,.sheet textarea{width:100%;background:#f5f5f7;border:1px solid #ddd;padding:12px;border-radius:8px;margin:6px 0}.sheet button{width:100%;padding:12px;border-radius:9px;border:0;font-weight:900;margin-top:6px}.up{background:#f0fff4;border:2px dashed #25D366;border-radius:10px;padding:20px;text-align:center;margin:10px 0}</style></head><body>
<div class="top"><b>OneXpress 925356739</b><div onclick="togCart()">🛒 <span class="badge" id="cartNum">0</span></div></div>
<div style="margin:10px;background:linear-gradient(135deg,#25D366,#128C7E);border-radius:12px;padding:12px;color:#fff"><b>TIMBERLAND 10.000 KZ | SABRINAS 3.000 KZ</b><br><small>Entrega 24h Luanda - Frete 1500 Kz</small></div>
<div class="grid" id="grid"></div>
<div class="cart" id="cartBox"><div style="display:flex;justify-content:space-between;font-weight:900"><span>CARRINHO</span><span style="color:red" onclick="togCart()">X</span></div><div id="cartList" style="margin:8px 0"></div><div style="background:#f5f5f7;padding:8px;border-radius:8px;font-weight:900">Total: <b id="totT" style="color:#25D366">0 Kz</b></div><button style="width:100%;background:#25D366;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:900;margin-top:8px" onclick="openM('checkout')">FINALIZAR NO WHATSAPP</button></div>
<div class="bottom"><div onclick="window.scrollTo(0,0)">🏠<br>Inicio</div><div onclick="togCart()">🛒<br>Carrinho <b id="bCart">0</b></div><div onclick="openM('adm')">🔐<br>ADM</div></div>

<div id="mCheckout" class="modal"><div class="sheet"><h3>FINALIZAR</h3><input id="nome" placeholder="Seu nome"><input id="tel" placeholder="WhatsApp" value="925"><textarea id="end" placeholder="Endereço: Viana, Cazenga..."></textarea><button style="background:#25D366;color:#fff" onclick="enviarZap()">📲 ENVIAR WHATSAPP</button><button style="background:#eee" onclick="closeM()">FECHAR</button></div></div>

<div id="mAdm" class="modal"><div class="sheet"><h3>🔐 PAINEL ADM - ADD PRODUTO</h3>
<input id="pNome" placeholder="Nome: Timberland ou Sabrina">
<input id="pPreco" type="number" placeholder="Preço: 10000 ou 3000">
<input id="pDesc" placeholder="Descrição: Tamanhos...">
<div class="up">
<div style="font-size:30px">📸</div>
<b>Foto do Produto</b><br>
<input type="file" id="fileImg" accept="image/*" style="margin-top:10px">
<img id="preview" style="width:100%;height:150px;object-fit:cover;border-radius:8px;margin-top:10px;display:none">
</div>
<button style="background:#111;color:#fff" onclick="addProd()">💾 SALVAR PRODUTO NA LOJA</button>
<div id="admLista" style="margin-top:10px"></div>
<button style="background:#eee" onclick="closeM()">FECHAR</button>
</div></div>

<script>
var prods=JSON.parse(localStorage.getItem('loja_v3')||'null')||[
{n:'Timberland Original',p:10000,d:'Tam 40-44 Couro',img:''},
{n:'Sabrinas Femininas',p:3000,d:'Tam 35-40 Confortavel',img:''}
];
var cart=JSON.parse(localStorage.getItem('cart_v3')||'[]');
var tempImg='';
document.getElementById('fileImg').addEventListener('change',function(e){
var f=e.target.files[0];if(!f)return;
var r=new FileReader();r.onload=function(ev){tempImg=ev.target.result;var im=document.getElementById('preview');im.src=tempImg;im.style.display='block'};r.readAsDataURL(f);
});
function save(){localStorage.setItem('loja_v3',JSON.stringify(prods));localStorage.setItem('cart_v3',JSON.stringify(cart))}
function render(){
var g=document.getElementById('grid');var h='';
for(var i=0;i<prods.length;i++){
var p=prods[i];
h+='<div class=prod>'+(p.img?'<img src="'+p.img+'">':'<div style="font-size:50px;background:#eee;border-radius:8px;padding:20px">👟</div>')+'<b>'+p.n+'</b><br><small>'+p.d+'</small><div class=price>'+p.p.toLocaleString()+' Kz</div><button class=add onclick="addCart('+i+')">+ CARRINHO</button><br><small style="color:red" onclick="delProd('+i+')">🗑️ Apagar (ADM)</small></div>';
}
g.innerHTML=h;renderCart();renderAdm();
}
function addCart(i){var ex=cart.find(function(c){return c.n==prods[i].n});if(ex)ex.q++;else cart.push({n:prods[i].n,p:prods[i].p,q:1});save();renderCart();togCart(true)}
function renderCart(){var t=0,c=0;var h='';for(var i=0;i<cart.length;i++){t+=cart[i].p*cart[i].q;c+=cart[i].q;h+='<div style="display:flex;justify-content:space-between;background:#f5f5f7;padding:8px;border-radius:8px;margin-bottom:5px"><span>'+cart[i].n+' x'+cart[i].q+'</span><span><button onclick="chg('+i+',-1)">-</button> '+cart[i].q+' <button onclick="chg('+i+',1)">+</button> <span onclick="rem('+i+')" style="color:red">X</span></span></div>'}document.getElementById('cartList').innerHTML=h||'Vazio';document.getElementById('totT').innerText=(t+1500).toLocaleString()+' Kz';document.getElementById('cartNum').innerText=c;document.getElementById('bCart').innerText=c;}
function chg(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);save();renderCart()}
function rem(i){cart.splice(i,1);save();renderCart()}
function togCart(f){var c=document.getElementById('cartBox');if(f)c.classList.add('show');else c.classList.toggle('show')}
function openM(t){closeM();document.getElementById('m'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('show')}
function closeM(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('show')})}
function addProd(){
var n=document.getElementById('pNome').value;var p=parseInt(document.getElementById('pPreco').value);var d=document.getElementById('pDesc').value;
if(!n||!p){alert('Coloca nome e preço');return}
if(!tempImg){alert('Escolhe uma foto! Clica em Escolher arquivo');return}
prods.push({n:n,p:p,d:d,img:tempImg});save();render();
document.getElementById('pNome').value='';document.getElementById('pPreco').value='';document.getElementById('pDesc').value='';tempImg='';document.getElementById('preview').style.display='none';document.getElementById('fileImg').value='';
alert('Produto salvo! Já aparece na loja!');
}
function delProd(i){if(confirm('Apagar?')){prods.splice(i,1);save();render()}}
function renderAdm(){var el=document.getElementById('admLista');var h='<b>'+prods.length+' produtos:</b>';for(var i=0;i<prods.length;i++){h+='<div style="display:flex;justify-content:space-between;background:#f5f5f7;padding:6px;border-radius:6px;margin:4px 0;font-size:11px"><span>'+prods[i].n+' - '+prods[i].p+' Kz</span><span style="color:red" onclick="delProd('+i+')">X</span></div>'}el.innerHTML=h}
function enviarZap(){
var n=document.getElementById('nome').value,t=document.getElementById('tel').value,e=document.getElementById('end').value;
if(!n||!t||!e){alert('Preencha tudo');return}
if(cart.length==0){alert('Carrinho vazio');return}
var tot=0;var lista='';for(var i=0;i<cart.length;i++){tot+=cart[i].p*cart[i].q;lista+='• '+cart[i].n+' x'+cart[i].q+'\n'}
var msg='🛒 PEDIDO OneXpress\n👤 '+n+'\n📞 '+t+'\n🏠 '+e+'\n\n📦 '+lista+'\n💵 TOTAL: '+(tot+1500).toLocaleString()+' Kz';
window.open('https://wa.me/244925356739?text='+encodeURIComponent(msg),'_blank');
cart=[];save();renderCart();closeM();
}
render();
</script></body></html>
