<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneXpress Shop - 9 Produtos Reais</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f6f7f9;padding-bottom:90px}
.top{background:#000;color:#fff;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.prod{background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.06);position:relative}
.img{width:100%;height:150px;background:#f0f0f0;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.img img{width:100%;height:100%;object-fit:cover}
.price{font-weight:900;font-size:16px;color:#25D366}.add{width:100%;background:#111;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:800;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:80}.bottom div{text-align:center;font-size:11px;flex:1;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:#fff;border-radius:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto;padding:16px}
.inp{width:100%;background:#f5f6f7;border:1px solid #ddd;padding:12px;border-radius:10px;margin:6px 0}.btn{width:100%;padding:13px;border-radius:10px;border:0;font-weight:900;margin-top:8px}.btnP{background:#111;color:#fff}.btnG{background:#25D366;color:#fff}
</style></head><body>
<div class="top"><b>One<span style="color:#25D366">Xpress</span> Shop</b><div>🛒 <b id="cartNum">0</b></div></div>
<div style="margin:12px;background:linear-gradient(135deg,#000,#25D366);border-radius:14px;padding:14px;color:#fff"><b>9 PRODUTOS REAIS</b><br><small>Timberland 10.000 Kz | Sabrinas 3.000 Kz | Frete 1500 Kz | 925356739</small></div>
<div class="grid" id="grid"></div>
<div class="bottom"><div onclick="window.scrollTo(0,0)">🏠<br>Inicio</div><div onclick="alert('Carrinho: '+cart.length+' itens')">🛒<br>Carrinho <b id="bCart">0</b></div><div onclick="openAdm()">⚙️<br>ADM</div></div>

<div id="mAdm" class="modal"><div class="sheet">
<h3>➕ PUBLICAR PRODUTO</h3>
<p style="font-size:11px;color:#666;margin:6px 0">Carrega foto da galeria, preenche e clica PUBLICAR - aparece na hora!</p>
<input class="inp" id="pNome" placeholder="Nome: Ex: Timberland Azul 42">
<input class="inp" id="pPreco" type="number" placeholder="Preço: 10000">
<input class="inp" id="pDesc" placeholder="Descrição: Tamanhos 39-44">
<div style="border:2px dashed #25D366;background:#f0fff4;border-radius:12px;padding:20px;text-align:center;margin:10px 0" onclick="document.getElementById('fileImg').click()">
<div style="font-size:30px">📸</div><b>CLICAR PARA CARREGAR FOTO</b><br><small>Galeria do telefone</small>
<input type="file" id="fileImg" accept="image/*" hidden>
<img id="preview" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-top:10px;display:none">
</div>
<button class="btn btnP" onclick="publicar()">💾 PUBLICAR AGORA NA LOJA</button>
<div id="listaAdm" style="margin-top:12px"></div>
<button class="btn" style="background:#eee" onclick="closeAdm()">FECHAR LOJA</button>
</div></div>

<script>
var prods = [
{n:"Sabrina KSM7403 Fashion",p:3000,d:"Tam 36-42 • 4 cores • 40PRS",img:"prod_1.jpg"},
{n:"Sabrina KSM7463 Laço",p:3000,d:"Tam 36-42 • 4 cores",img:"prod_2.jpg"},
{n:"Sabrina KSM7472 Luxo",p:3000,d:"Tam 36-42 • Pedraria",img:"prod_3.jpg"},
{n:"Sabrina KSM7548 Lisa",p:3000,d:"Tam 36-42 • Simples",img:"prod_4.jpg"},
{n:"Infantil KGM7124",p:3000,d:"Tam 25-30 • Menina",img:"prod_5.jpg"},
{n:"Infantil KGM7128",p:3000,d:"Tam 25-30 • Bico branco",img:"prod_6.jpg"},
{n:"Timberland KA16700C",p:10000,d:"Tam 39-44 • 24PRS",img:"prod_7.jpg"},
{n:"Timberland Premium Azul",p:10000,d:"Tam 39-44 • Original",img:"prod_8.jpg"},
{n:"Timberland KA16807A",p:10000,d:"Tam 39-44 • 24PRS",img:"prod_9.jpg"}
];
var cart = [];
var tempFoto = "";

document.getElementById('fileImg').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    tempFoto = ev.target.result;
    var pre = document.getElementById('preview');
    pre.src = tempFoto;
    pre.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

function render(){
  var g = document.getElementById('grid');
  var html = "";
  for(var i=0; i<prods.length; i++){
    var p = prods[i];
    var foto = p.img.startsWith('data:')? p.img : p.img;
    // Se começa com data: é base64, se não é arquivo prod_x.jpg
    var imgTag = foto.startsWith('data:')? '<img src="'+foto+'">' : '<img src="'+foto+'" onerror="this.parentElement.innerHTML=\'📦<br><small>'+p.img+'</small>\'">';
    html += '<div class=prod><div class=img>'+imgTag+'</div><b style="font-size:12px">'+p.n+'</b><br><small style="font-size:10px;color:#777">'+p.d+'</small><div class=price>'+p.p.toLocaleString()+' Kz</div><button class=add onclick="addCart('+i+')">+ CARRINHO</button><button onclick="apagar('+i+')" style="width:100%;background:#ff3b3020;color:#ff3b30;border:0;padding:6px;border-radius:8px;margin-top:4px;font-size:10px">🗑️ Apagar</button></div>';
  }
  g.innerHTML = html;
  document.getElementById('cartNum').innerText = cart.length;
  document.getElementById('bCart').innerText = cart.length;
  // lista ADM
  var la = document.getElementById('listaAdm');
  var h2 = '<b>'+prods.length+' produtos na loja:</b>';
  for(var i=0;i<prods.length;i++){h2+='<div style="background:#f5f5f7;padding:8px;border-radius:8px;margin:4px 0;font-size:11px;display:flex;justify-content:space-between"><span>'+prods[i].n+' - '+prods[i].p+' Kz</span><span style="color:red" onclick="apagar('+i+')">X</span></div>'}
  la.innerHTML = h2;
}

function publicar(){
  var nome = document.getElementById('pNome').value;
  var preco = parseInt(document.getElementById('pPreco').value);
  var desc = document.getElementById('pDesc').value;
  if(!nome ||!preco){alert('⚠️ Coloca nome e preço!');return}
  if(!tempFoto){alert('⚠️ Carrega uma foto! Clica no quadrado verde 📸');return}

  // ADICIONA NO INICIO
  prods.unshift({n:nome, p:preco, d:desc, img:tempFoto});

  // LIMPA FORM
  document.getElementById('pNome').value='';
  document.getElementById('pPreco').value='';
  document.getElementById('pDesc').value='';
  tempFoto='';
  document.getElementById('preview').style.display='none';
  document.getElementById('fileImg').value='';

  render();
  alert('✅ PRODUTO PUBLICADO! Já aparece na loja! Rola pra cima pra ver!');
  closeAdm();
  window.scrollTo(0,0);
}

function apagar(i){
  if(!confirm('Apagar '+prods[i].n+'?'))return;
  prods.splice(i,1);
  render();
}

function addCart(i){
  cart.push(prods[i]);
  render();
  alert('✅ '+prods[i].n+' no carrinho!');
}

function openAdm(){document.getElementById('mAdm').classList.add('show')}
function closeAdm(){document.getElementById('mAdm').classList.remove('show')}

render();
</script></body></html>
